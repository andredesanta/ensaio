[project]
name = "ensaio"
version = "0.0.0"
description = "A PostHog-shaped feature flag platform. Learning project; no affiliation with PostHog."
requires-python = ">=3.13"
dependencies = [
    "ensaio-kernel",
    "django~=5.2.0",
    "django-cors-headers~=4.9.0",
    "django-structlog~=10.1.0",
    "djangorestframework~=3.17.2",
    "drf-spectacular~=0.30.0",
    "psycopg[binary]~=3.2.10",
    "structlog==25.5.0",
]

[dependency-groups]
dev = [
    "django-stubs~=5.2.0",
    "djangorestframework-stubs~=3.16.0",
    "hypothesis~=6.140.0",
    "mypy~=2.1.0",
    "pytest~=8.4.2",
    "pytest-django~=4.14.0",
    "ruff~=0.15.20",
    # 0.29.0's config parser segfaults on CPython 3.14. 0.35.1 does not.
    "tach~=0.35.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/ensaio_kernel"]

[tool.uv.sources]
ensaio-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ensaio_project", "products"]

[tool.ruff]
line-length = 120
# Same split PostHog uses: the formatter targets 3.13 syntax even when the
# runtime is 3.14, so formatting does not depend on the newest grammar.
target-version = "py313"
extend-exclude = [".venv", "frontend/node_modules"]

[tool.ruff.format]
# Ruff's formatter is Black-compatible. Do not add the black package.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["ensaio_kernel", "ensaio_project", "products"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
files = ["ensaio_project", "products", "packages/ensaio_kernel", "scripts", "manage.py"]
exclude = ["^\\.venv/"]

[tool.django-stubs]
django_settings_module = "ensaio_project.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ensaio_project.settings"
testpaths = ["products", "packages"]
addopts = ["--strict-markers"]
