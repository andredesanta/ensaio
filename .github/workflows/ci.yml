name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.12-alpine
        env:
          POSTGRES_DB: ensaio
          POSTGRES_USER: ensaio
          POSTGRES_PASSWORD: ensaio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ensaio -d ensaio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run tach check
      - run: uv run tach check-external -e '**/tests/**'
      - run: ./bin/check-schema
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - working-directory: frontend
        run: corepack pnpm run generate
      - run: git diff --exit-code
      - working-directory: frontend
        run: corepack pnpm exec tsc --noEmit
      - working-directory: frontend
        run: corepack pnpm run lint
      - working-directory: frontend
        run: corepack pnpm run format:check
      - working-directory: frontend
        run: corepack pnpm test
      - working-directory: frontend
        run: corepack pnpm run build
      - working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium
      - working-directory: frontend
        run: corepack pnpm run test:smoke

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - working-directory: services/mcp
        run: corepack pnpm install --frozen-lockfile
      - run: ./bin/generate-mcp
      - run: git diff --exit-code
      - working-directory: services/mcp
        run: corepack pnpm run typecheck
      - working-directory: services/mcp
        run: corepack pnpm run lint
      - working-directory: services/mcp
        run: corepack pnpm run format:check
      - working-directory: services/mcp
        run: corepack pnpm run build
      - working-directory: services/mcp
        run: corepack pnpm test
